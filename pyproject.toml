[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-memory"
version = "0.1.0"
description = "Local-first long-term memory MCP server for AI agents. SQLite, offline, zero cloud."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "local-memory contributors"}]
keywords = ["memory", "mcp", "sqlite", "ai-agents", "local-first", "offline"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
semantic = ["scikit-learn>=1.3"]

[project.scripts]
local-memory = "local_memory.__main__:main"

[project.urls]
Repository = "https://github.com/Sergey-Vladimirovich-Hankok/local-memory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
srcPath = "src"
